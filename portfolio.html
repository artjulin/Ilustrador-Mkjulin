<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IlustraPro - Portfólio</title>
  <link rel="stylesheet" href="portfolio.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .portfolio-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(192, 38, 211, 0.3);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .portfolio-card:hover {
      transform: translateY(-12px);
      border-color: #c026d3;
      box-shadow: 0 25px 50px rgba(192, 38, 211, 0.3);
    }

    .portfolio-image {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }

    .portfolio-info {
      padding: 22px;
    }

    .portfolio-info h3 {
      color: #e879f9;
      margin-bottom: 8px;
      font-size: 1.35rem;
    }

    .portfolio-category {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(90deg, #4c1d95, #6b21a8);
      border-radius: 30px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">IlustraPro</div>
    <nav>
      <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
      <a href="agenda.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Agenda</a>
      <a href="clientes.html" class="nav-link"><i class="fas fa-users"></i> Clientes</a>
      <a href="portfolio.html" class="nav-link active"><i class="fas fa-images"></i> Portfólio</a>
      <a href="servicos.html" class="nav-link"><i class="fas fa-palette"></i> Serviços</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1 class="hero">Meu Portfólio</h1>
      <button class="btn" onclick="abrirModalPortfolio()">
        <i class="fas fa-plus"></i> Adicionar Obra
      </button>
    </div>

    <div class="portfolio-grid" id="portfolio-grid"></div>
  </div>

  <script>
    let portfolio = [
      {
        id: 1,
        titulo: "Deiragon - A Pirata",
        categoria: "Personagem",
        descricao: "Ilustração digital de personagem fantástica com temática pirata. Estilo dark fantasy.",
        data: "2026-06-02",
        imagem: "IMG-20260602-WA0019.jpg"  // Sua imagem
      },
      {
        id: 2,
        titulo: "A Biblioteca Esquecida",
        categoria: "Capa de Livro",
        descricao: "Capa para romance de fantasia",
        data: "2026-05-20",
        imagem: "IMG-20260602-WA0013.jpg"
      }
    ];

    function renderizarPortfolio() {
      const grid = document.getElementById('portfolio-grid');
      grid.innerHTML = '';

      portfolio.forEach(obra => {
        const card = document.createElement('div');
        card.className = 'portfolio-card';
        card.innerHTML = `
          <img src="${obra.imagem}" class="portfolio-image" alt="${obra.titulo}">
          <div class="portfolio-info">
            <span class="portfolio-category">${obra.categoria}</span>
            <h3>${obra.titulo}</h3>
            <p style="color:#bbb; font-size:0.98rem;">${obra.descricao}</p>
            <small style="color:#777; margin-top:10px; display:block;">${obra.data}</small>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function abrirModalPortfolio() {
      alert("Funcionalidade de adicionar nova obra em breve!");
    }

    // Carregar ao abrir a página
    window.onload = renderizarPortfolio;
  </script>
</body>
</html>
