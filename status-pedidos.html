<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html">Agendar</a></li>
                <li><a href="status-pedidos.html" class="active">Meus Pedidos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="admin.html" class="admin-link">🔧 Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container" style="max-width: 1000px;">
        <h2>Meus Pedidos</h2>
        <p style="text-align:center; margin-bottom:1.5rem;" id="userInfo"></p>

        <div id="pedidosContainer">
            <table id="pedidosTable" style="width:100%; display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Serviço</th>
                        <th>Descrição</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="pedidosBody"></tbody>
            </table>

            <div id="emptyMessage" style="text-align:center; padding:4rem; color:#94a3b8;">
                <h3>Você ainda não tem pedidos.</h3>
                <a href="agendamento.html" class="btn-primary" style="display:inline-block; margin-top:1rem;">Fazer Agendamento</a>
            </div>
        </div>

        <!-- Link para o Chat (só aparece se tiver pedidos) -->
        <div id="chatLink" style="text-align:center; margin-top:2rem; display:none;">
            <a href="chat-cliente.html" class="btn-primary" style="background:#22c55e;">
                💬 Abrir Chat com o Artista
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();

        if (!currentUser) {
            alert("Você precisa estar logado.");
            window.location.href = "cadastro.html";
        } else {
            document.getElementById('userInfo').innerHTML = `Logado como: <strong>${currentUser.nome}</strong>`;
            loadMeusPedidos(currentUser.id);
        }

        async function loadMeusPedidos(userId) {
            try {
                const res = await fetch(`/api/meus-pedidos/${userId}`);
                const pedidos = await res.json();

                if (pedidos.length > 0) {
                    document.getElementById('pedidosTable').style.display = 'table';
                    document.getElementById('emptyMessage').style.display = 'none';
                    document.getElementById('chatLink').style.display = 'block';
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
