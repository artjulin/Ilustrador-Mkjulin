<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html">Agendar</a></li>
                <li><a href="status-pedidos.html" class="active">Meus Pedidos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="admin.html" class="admin-link">🔧 Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container" style="max-width: 1000px;">
        <h2>Meus Pedidos</h2>
        <p style="text-align:center; margin-bottom:2rem; color:#94a3b8;" id="userInfo"></p>

        <div id="pedidosContainer">
            <table id="pedidosTable" style="width:100%; display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Serviço</th>
                        <th>Descrição</th>
                        <th>Data Preferencial</th>
                        <th>Pagamento</th>
                        <th>Valor</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="pedidosBody"></tbody>
            </table>

            <div id="emptyMessage" style="text-align:center; padding:4rem; color:#94a3b8; display:none;">
                <h3>Você ainda não tem pedidos.</h3>
                <a href="agendamento.html" class="btn-primary" style="display:inline-block; margin-top:1rem;">Fazer Primeiro Agendamento</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();

        if (!currentUser) {
            alert("Você precisa estar logado para ver seus pedidos.");
            window.location.href = "cadastro.html";
        } else {
            document.getElementById('userInfo').innerHTML = `
                Logado como: <strong>${currentUser.nome}</strong> (${currentUser.username})
            `;
            loadMeusPedidos(currentUser.id);
        }

        async function loadMeusPedidos(userId) {
            try {
                const response = await fetch(`/api/meus-pedidos/${userId}`);
                const pedidos = await response.json();

                const tbody = document.getElementById('pedidosBody');
                tbody.innerHTML = '';

                if (pedidos.length === 0) {
                    document.getElementById('emptyMessage').style.display = 'block';
                    document.getElementById('pedidosTable').style.display = 'none';
                    return;
                }

                document.getElementById('pedidosTable').style.display = 'table';
                document.getElementById('emptyMessage').style.display = 'none';

                pedidos.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${p.id}</strong></td>
                        <td>${p.servico}</td>
                        <td>${p.descricao.substring(0, 60)}...</td>
                        <td>${p.data_preferencial}</td>
                        <td>${p.pagamento}</td>
                        <td>R$ ${p.valor}</td>
                        <td>
                            <span style="color: ${p.status === 'Pendente' ? '#fbbf24' : p.status === 'Em Produção' ? '#22d3ee' : '#4ade80'}">
                                ● ${p.status}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('emptyMessage').innerHTML = `<p style="color:#ef4444;">Erro ao carregar pedidos.</p>`;
                document.getElementById('emptyMessage').style.display = 'block';
            }
        }
    </script>
</body>
</html>
