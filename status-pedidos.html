<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html">Agendar</a></li>
                <li><a href="status-pedidos.html" class="active">Meus Pedidos</a></li>
                <li><a href="cadastro.html" id="cadastroLink">Cadastro</a></li>
                <li><a href="admin.html" class="admin-link">🔧 Admin</a></li>
            </ul>
            <button class="user-btn" id="userBtn">👤 Entrar</button>
        </nav>
    </header>

    <main class="form-container" style="max-width: 1000px;">
        <h2>Meus Pedidos</h2>
        <p id="userInfo" style="text-align:center; margin-bottom:2rem;"></p>

        <div id="pedidosContainer">
            <table id="pedidosTable" style="width:100%; display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Serviço</th>
                        <th>Descrição</th>
                        <th>Data</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="pedidosBody"></tbody>
            </table>

            <div id="emptyMessage" style="text-align:center; padding:4rem; color:#94a3b8;">
                <h3>Você ainda não tem pedidos.</h3>
                <a href="agendamento.html" class="btn-primary" style="display:inline-block; margin-top:1rem;">Fazer Agendamento</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();
        const cadastroLink = document.getElementById('cadastroLink');
        const userBtn = document.getElementById('userBtn');

        if (currentUser) {
            cadastroLink.style.display = 'none';
            userBtn.innerHTML = `👤 ${currentUser.nome.split(" ")[0]} ▼`;
            userBtn.onclick = () => {
                if (confirm("Deseja sair da conta?")) logout();
            };
            document.getElementById('userInfo').innerHTML = `Logado como: <strong>${currentUser.nome}</strong>`;
        } else {
            cadastroLink.style.display = 'list-item';
            userBtn.textContent = "👤 Entrar";
            userBtn.onclick = () => window.location.href = 'cadastro.html';
        }
    </script>
</body>
</html>
