<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Mkjulin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Mkjulin</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="comprar.html">Preços</a></li>
            <li><a href="agendamento.html">Agendar</a></li>
            <li><a href="status-pedidos.html" class="active">Meus Pedidos</a></li>
        </ul>
        <button class="user-btn">👤 Perfil</button>
    </nav>

    <main>
        <section class="section-card">
            <h1>Meus Pedidos</h1>
            <input type="email" id="emailFiltro" placeholder="Digite seu email para ver pedidos" style="width:100%; padding:12px; margin-bottom:20px;">
            <button onclick="carregarMeusPedidos()" class="btn-primary">Buscar Meus Pedidos</button>
            
            <div id="lista-pedidos"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script>
        async function carregarMeusPedidos() {
            const email = document.getElementById('emailFiltro').value;
            const res = await fetch(`/api/meus-pedidos?email=${email}`);
            const pedidos = await res.json();
            
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '';

            if (pedidos.length === 0) {
                container.innerHTML = '<p>Nenhum pedido encontrado.</p>';
                return;
            }

            pedidos.forEach(p => {
                const div = document.createElement('div');
                div.className = 'order-card';
                div.innerHTML = `
                    <h3>Pedido #${p.id}</h3>
                    <p><strong>Tipo:</strong> ${p.tipo}</p>
                    <p><strong>Status:</strong> ${p.status}</p>
                    <p><strong>Data:</strong> ${p.data}</p>
                    <button class="btn-primary" onclick="abrirChat(${p.id})">💬 Abrir Chat</button>
                `;
                container.appendChild(div);
            });
        }

        function abrirChat(pedidoId) {
            const msg = prompt("Digite sua mensagem para o artista:");
            if (msg) {
                fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pedidoId, mensagem: msg, remetente: 'cliente' })
                });
                alert('Mensagem enviada!');
            }
        }
    </script>
</body>
</html>
