<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IlustraPro - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    .login-container { ... } /* mantenha o estilo anterior */
    /* (use o estilo bonito que eu te enviei antes) */
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1 class="logo-login">IlustraPro</h1>
      <p class="subtitle">Entre no sistema</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Usuário</label>
          <input type="text" id="username" placeholder="admin ou seu email" required>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="password" required>
        </div>

        <button type="submit" class="btn-login">
          Entrar
        </button>
      </form>

      <p style="text-align:center; margin-top:20px; color:#777;">
        Admin: <strong>admin</strong> / 1234
      </p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (data.success) {
        localStorage.setItem('user', JSON.stringify(data.user));
        alert(`Bem-vindo, ${data.user.nome}!`);
        window.location.href = "index.html";
      } else {
        alert("Usuário ou senha incorretos!");
      }
    });
  </script>
</body>
</html>
