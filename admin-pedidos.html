<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os Pedidos - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .descricao-completa {
            max-width: 300px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }
        table {
            font-size: 0.95rem;
        }
        th, td {
            padding: 12px 10px;
            vertical-align: top;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html">🔧 Admin</a></li>
                <li><a href="admin-pedidos.html" class="admin-link active">📋 Todos os Pedidos</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main class="form-container" style="max-width: 1400px;">
        <h2>Todos os Pedidos</h2>
        <p style="margin-bottom: 2rem; color: #94a3b8;">Aqui você vê a descrição completa e os dados do cliente.</p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>CPF</th>
                    <th>Email</th>
                    <th>Serviço</th>
                    <th>Descrição Completa</th>
                    <th>Data</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Alterar Status</th>
                </tr>
            </thead>
            <tbody id="pedidosBody"></tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Painel Administrativo</p>
    </footer>

    <script>
        async function loadPedidos() {
            try {
                const res = await fetch('/api/agendamentos');
                const pedidos = await res.json();
                const tbody = document.getElementById('pedidosBody');
                tbody.innerHTML = '';

                pedidos.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${p.id}</strong></td>
                        <td>${p.cliente_nome || '-'}</td>
                        <td>${p.cliente_cpf || '-'}</td>
                        <td>${p.cliente_email || '-'}</td>
                        <td>${p.servico}</td>
                        <td>
                            <div class="descricao-completa">${p.descricao || '-'}</div>
                        </td>
                        <td>${p.data_preferencial || '-'}</td>
                        <td>R$ ${p.valor || 0}</td>
                        <td>
                            <span style="color: ${getStatusColor(p.status)}">
                                ● ${p.status}
                            </span>
                        </td>
                        <td>
                            <select onchange="atualizarStatus(${p.id}, this.value)" 
                                    style="padding: 8px 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #6366f1; min-width: 140px;">
                                <option value="">Alterar...</option>
                                <option value="Pendente">Pendente</option>
                                <option value="Em Produção">Em Produção</option>
                                <option value="Aguardando Feedback">Aguardando Feedback</option>
                                <option value="Concluído">Concluído</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function getStatusColor(status) {
            if (status === 'Pendente') return '#fbbf24';
            if (status === 'Em Produção') return '#22d3ee';
            if (status === 'Aguardando Feedback') return '#a78bfa';
            if (status === 'Concluído') return '#4ade80';
            if (status === 'Cancelado') return '#ef4444';
            return '#94a3b8';
        }

        async function atualizarStatus(id, novoStatus) {
            if (!novoStatus) return;

            try {
                const res = await fetch(`/api/agendamentos/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });

                const data = await res.json();
                if (data.success) {
                    alert(`✅ Status dos pedidos #${id} atualizado para: ${novoStatus}`);
                    loadPedidos();
                } else {
                    alert("Erro ao atualizar status");
                }
            } catch (e) {
                alert("Erro de conexão");
            }
        }

        window.onload = loadPedidos;
    </script>
</body>
</html>
