<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os Pedidos - Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html">🔧 Admin</a></li>
                <li><a href="admin-pedidos.html" class="admin-link active">📋 Todos os Pedidos</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main>
        <h1>Todos os Pedidos</h1>
        <table id="pedidosTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Descrição</th>
                    <th>Data</th>
                    <th>Pagamento</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="pedidosBody">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Painel Administrativo</p>
    </footer>

    <script>
        async function loadPedidos() {
            try {
                const response = await fetch('/api/agendamentos');
                const pedidos = await response.json();
                
                const tbody = document.getElementById('pedidosBody');
                tbody.innerHTML = '';

                pedidos.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${p.id}</td>
                        <td>${p.cliente_nome}</td>
                        <td>${p.servico}</td>
                        <td>${p.descricao.substring(0, 60)}...</td>
                        <td>${p.data_preferencial}</td>
                        <td>${p.pagamento}</td>
                        <td>R$ ${p.valor}</td>
                        <td><span style="color: ${p.status === 'Pendente' ? '#fbbf24' : p.status === 'Em Produção' ? '#22d3ee' : '#4ade80'}">
                            ● ${p.status}
                        </span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }

        window.onload = loadPedidos;
    </script>
</body>
</html>
