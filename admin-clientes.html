<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .actions { display: flex; gap: 8px; }
        .btn-small { padding: 6px 14px; font-size: 0.85rem; border-radius: 8px; }
        .cpf-destaque { color: #c026d3; font-weight: 700; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html">🔧 Admin</a></li>
                <li><a href="admin-clientes.html" class="admin-link active">👥 Clientes</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main class="form-container" style="max-width: 1100px;">
        <h2>Clientes Cadastrados</h2>
        <p style="margin-bottom: 1.5rem; color: #94a3b8;">Total de clientes: <strong id="totalClientes">0</strong></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>CPF</th>
                    <th>Data de Cadastro</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="clientesBody"></tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Painel Administrativo</p>
    </footer>

    <script>
        async function loadClientes() {
            try {
                const res = await fetch('/api/clientes');
                const clientes = await res.json();
                document.getElementById('totalClientes').textContent = clientes.length;
                const tbody = document.getElementById('clientesBody');
                tbody.innerHTML = '';

                clientes.forEach(c => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${c.id}</td>
                        <td>${c.nome}</td>
                        <td>${c.username}</td>
                        <td class="cpf-destaque">${c.cpf || '-'}</td>
                        <td>${c.data_cadastro ? new Date(c.data_cadastro).toLocaleDateString('pt-BR') : '-'}</td>
                        <td class="actions">
                            <button onclick="editarCliente(${c.id})" class="btn-small" style="background:#6366f1;">Editar</button>
                            <button onclick="excluirCliente(${c.id})" class="btn-small" style="background:#ef4444;">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function editarCliente(id) {
            const cliente = clientes.find(c => c.id === id);
            if (!cliente) return;

            const novoNome = prompt("Novo nome:", cliente.nome);
            const novoEmail = prompt("Novo email:", cliente.username);
            const novoCPF = prompt("Novo CPF:", cliente.cpf);

            if (!novoNome || !novoEmail) return;

            try {
                const res = await fetch(`/api/clientes/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: novoNome, username: novoEmail, cpf: novoCPF })
                });
                const data = await res.json();
                if (data.success) {
                    alert("✅ Cliente atualizado com sucesso!");
                    loadClientes();
                }
            } catch (e) {
                alert("Erro ao atualizar cliente");
            }
        }

        async function excluirCliente(id) {
            if (!confirm("Tem certeza que deseja excluir este cliente?")) return;

            try {
                const res = await fetch(`/api/clientes/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("✅ Cliente excluído com sucesso!");
                    loadClientes();
                }
            } catch (e) {
                alert("Erro ao excluir cliente");
            }
        }

        window.onload = loadClientes;
    </script>
</body>
</html>
