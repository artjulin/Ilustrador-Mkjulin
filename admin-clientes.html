<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Admin IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html">🔧 Admin</a></li>
                <li><a href="admin-clientes.html" class="admin-link active">👥 Clientes</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main>
        <h1>Clientes Cadastrados</h1>
        <p style="margin-bottom: 2rem; color: #94a3b8;">Total de clientes: <strong id="totalClientes">0</strong></p>

        <table id="clientesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Username</th>
                    <th>Data Cadastro</th>
                    <th>Pedidos</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="clientesBody">
                <!-- Preenchido via JavaScript -->
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Painel Administrativo</p>
    </footer>

    <script>
        function loadClientes() {
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            const tbody = document.getElementById('clientesBody');
            tbody.innerHTML = '';
            
            document.getElementById('totalClientes').textContent = clientes.length;

            clientes.forEach(cliente => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${cliente.id}</td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.username}</td>
                    <td>${cliente.dataCadastro}</td>
                    <td><strong>${cliente.pedidos || 0}</strong></td>
                    <td>
                        <button onclick="verPedidos('${cliente.id}')" style="background:#6366f1; color:white; border:none; padding:6px 12px; border-radius:6px;">Ver Pedidos</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function verPedidos(clienteId) {
            alert(`Mostrando pedidos do cliente ${clienteId} (Funcionalidade em desenvolvimento)`);
        }

        // Carregar ao abrir a página
        window.onload = loadClientes;
    </script>
</body>
</html>
