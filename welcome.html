<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IlustraPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0a1f, #2a1b4a);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-box {
      text-align: center;
      max-width: 700px;
      padding: 60px 40px;
    }

    .logo-big {
      font-size: 5rem;
      font-weight: 900;
      background: linear-gradient(90deg, #c026d3, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 1.6rem;
      color: #c4b5fd;
      margin-bottom: 50px;
    }

    .btn {
      display: inline-block;
      padding: 18px 45px;
      margin: 15px;
      font-size: 1.2rem;
      border-radius: 50px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn-admin {
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      color: white;
    }

    .btn-client {
      background: transparent;
      border: 2px solid #4ade80;
      color: #4ade80;
    }

    .btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="welcome-box">
    <h1 class="logo-big">IlustraPro</h1>
    <p class="subtitle">Estúdio Digital de Ilustração</p>
    
    <div>
      <a href="login.html" class="btn btn-admin">
        <i class="fas fa-user-tie"></i> Entrar como Administrador
      </a>
      
      <a href="login.html" class="btn btn-client">
        <i class="fas fa-user"></i> Entrar como Cliente
      </a>
    </div>

    <p style="margin-top: 60px; color: #888;">
      Crie artes incríveis • Gerencie seus clientes • Organize sua agenda
    </p>
  </div>

</body>
</html>
