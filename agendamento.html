<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Mkjulin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Mkjulin</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="comprar.html">Preços</a></li>
            <li><a href="agendamento.html" class="active">Agendar</a></li>
            <li><a href="status-pedidos.html">Meus Pedidos</a></li>
        </ul>
        <button class="user-btn" onclick="logout()">Sair</button>
    </nav>

    <main>
        <section class="section-card" id="agendamentoContent">
            <h1>Agende sua Ilustração</h1>
            <!-- Formulário aqui (mesmo de antes) -->
            <form id="agendamentoForm">
                <input type="text" id="nome" placeholder="Seu Nome" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="tipo" placeholder="Tipo de Ilustração" required>
                <textarea id="descricao" rows="6" placeholder="Descreva sua ideia..." required></textarea>
                <button type="submit" class="btn-primary">Enviar Agendamento</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin.</p>
    </footer>

    <script>
        // Verifica login
        function verificarLogin() {
            const usuario = localStorage.getItem('usuario');
            if (!usuario) {
                alert("⚠️ Você precisa estar logado para agendar um projeto!\n\nRedirecionando para a página de login...");
                window.location.href = "cadastro.html";
                return false;
            }
            return true;
        }

        // Executa verificação ao carregar a página
        window.onload = function() {
            if (!verificarLogin()) return;
            
            // Formulário (mesmo código anterior)
            document.getElementById('agendamentoForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                alert('✅ Agendamento enviado com sucesso! (Backend simulado)');
                // Aqui você pode chamar o /api/agendar
            });
        };

        function logout() {
            localStorage.removeItem('usuario');
            alert('Você saiu da conta.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
