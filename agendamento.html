<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html" class="active">Agendar</a></li>
                <li><a href="status-pedido.html">Meus Pedidos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="admin.html" class="admin-link">🔧 Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2>Fazer Agendamento</h2>
        <form id="agendamentoForm">
            <label>Serviço Desejado</label>
            <select name="servico" required>
                <option value="">Selecione...</option>
                <option value="Chibi/Cartoon">Chibi / Cartoon - R$ 50</option>
                <option value="Anime Full Body">Anime Full Body - R$ 120</option>
                <option value="Concept Art">Concept Art - R$ 200</option>
            </select>

            <label>Descrição da Arte</label>
            <textarea name="descricao" rows="6" placeholder="Descreva com detalhes..." required></textarea>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
                <div>
                    <label>Data Preferencial</label>
                    <input type="date" name="data_preferencial" required>
                </div>
                <div>
                    <label>Forma de Pagamento</label>
                    <select name="pagamento" required>
                        <option value="PIX">PIX</option>
                        <option value="Cartão">Cartão</option>
                        <option value="Transferência">Transferência</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-primary">Enviar Agendamento</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
