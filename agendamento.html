<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Mkjulin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Mkjulin</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="comprar.html">Preços</a></li>
            <li><a href="agendamento.html" class="active">Agendar</a></li>
            <li><a href="status-pedidos.html">Meus Pedidos</a></li>
        </ul>
        <button class="user-btn" onclick="logout()">Sair</button>
    </nav>

    <main>
        <section class="section-card">
            <h1>Agendar Novo Projeto</h1>
            <p style="text-align:center; margin-bottom:30px;">O administrador será notificado imediatamente após o envio.</p>
            
            <form id="agendamentoForm" style="max-width:700px; margin:0 auto;">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
                <input type="email" id="email" placeholder="Seu Email" required>
                <input type="text" id="tipo" placeholder="Tipo de Ilustração (ex: Anime Full Body)" required>
                <textarea id="descricao" rows="6" placeholder="Descreva sua ideia com o máximo de detalhes possível..." required></textarea>
                
                <button type="submit" class="btn-primary" style="width:100%; padding:16px; font-size:1.1rem;">
                    Enviar Agendamento para o Administrador
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.getElementById('agendamentoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value
            };

            try {
                const response = await fetch('/api/agendar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Agendamento enviado com sucesso!\nO administrador foi notificado e entrará em contato.');
                    document.getElementById('agendamentoForm').reset();
                }
            } catch (error) {
                alert('Erro ao enviar agendamento. Tente novamente.');
            }
        });

        function logout() {
            localStorage.removeItem('usuario');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
