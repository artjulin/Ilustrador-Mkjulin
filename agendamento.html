<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="tradicional.html">Tradicional</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html" class="active">Agendar</a></li>
                <li><a href="status-pedido.html">Meus Pedidos</a></li>
            </ul>
            <button class="user-btn" onclick="checkLogin()">👤 Entrar</button>
        </nav>
    </header>

    <main class="form-container">
        <h2>Fazer Agendamento</h2>
        <form id="agendamentoForm">
            <!-- campos do formulário -->
            <button type="submit" class="btn-primary">Enviar Agendamento</button>
        </form>
    </main>

    <script>
        // Proteção: obrigatório estar logado
        if (!localStorage.getItem('user')) {
            alert("Você precisa estar cadastrado e logado para agendar.");
            window.location.href = "cadastro.html";
        }

        document.getElementById('agendamentoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("✅ Agendamento enviado com sucesso! (Sistema de login ativo)");
            // Aqui você pode enviar para o backend depois
        });
    </script>
</body>
</html>
