<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Mkjulin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Mkjulin</div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="comprar.html">Preços</a></li>
            <li><a href="agendamento.html" class="active">Agendar</a></li>
            <li><a href="status-pedidos.html">Meus Pedidos</a></li>
        </ul>
        <button class="user-btn">👤 Entrar</button>
    </nav>

    <main>
        <section class="section-card">
            <h1>Agende sua Ilustração</h1>
            <form id="agendamentoForm">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
                <input type="email" id="email" placeholder="Seu Email" required>
                <input type="text" id="tipo" placeholder="Tipo de Ilustração (ex: Anime Full Body)" required>
                <textarea id="descricao" rows="6" placeholder="Descreva sua ideia com detalhes..." required></textarea>
                <button type="submit" class="btn-primary">Enviar Agendamento</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.getElementById('agendamentoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                tipo: document.getElementById('tipo').value,
                descricao: document.getElementById('descricao').value
            };

            const response = await fetch('/api/agendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                alert('✅ Agendamento enviado com sucesso! Verifique em "Meus Pedidos".');
                document.getElementById('agendamentoForm').reset();
            } else {
                alert('Erro ao enviar agendamento.');
            }
        });
    </script>
</body>
</html>
