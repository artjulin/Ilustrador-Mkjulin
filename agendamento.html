<body>
    <nav class="navbar">
        <div class="logo">Mkjulin</div>
        <ul class="nav-links">

    <main>
        <section class="section-card">
            <h1>Agende seu Projeto</h1>
            <p>Preencha os dados abaixo para marcar sua ilustração.</p>
            <!-- Formulário de agendamento aqui -->
            <form style="max-width: 600px; margin: 2rem auto;">
                <input type="text" placeholder="Seu Nome" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#334155; border:none; color:white;">
                <input type="email" placeholder="Email" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#334155; border:none; color:white;">
                <textarea placeholder="Descreva sua ideia..." rows="5" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; background:#334155; border:none; color:white;"></textarea>
                <button type="submit" class="btn-primary">Enviar Agendamento</button>
            </form>
        </section>
    </main>
