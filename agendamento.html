<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar igual às outras -->
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <!-- ... mesmos links ... -->
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2 style="text-align:center; margin-bottom:2rem;">Fazer Agendamento</h2>
        <form id="agendamentoForm">
            <label>Serviço:</label>
            <select name="servico" required>
                <option value="Chibi/Cartoon">Chibi / Cartoon - R$50</option>
                <option value="Anime Full Body">Anime Full Body - R$120</option>
                <option value="Concept Art">Concept Art - R$200</option>
            </select>

            <label>Descrição da Arte:</label>
            <textarea name="descricao" rows="5" placeholder="Descreva o personagem, pose, cores, referências..." required></textarea>

            <label>Data Preferencial:</label>
            <input type="date" name="data" required>

            <button type="submit" class="btn-primary" style="width:100%; margin-top:1rem;">Enviar Agendamento</button>
        </form>
    </main>
</body>
</html>
