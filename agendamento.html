<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Agendamento - Mkjulin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Mkjulin</div>
            <ul>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="agendamento.html" class="active">Fazer Agendamento</a></li>
                <li><a href="status-pedido.html">Meus Pedidos</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2>Solicitar Nova Ilustração</h2>
        <p>Preencha os detalhes do seu pedido para realizar o agendamento.</p>

        <form id="form-agendamento" action="/api/agendamentos" method="POST">
            <div class="form-group">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="form-group">
                <label for="estilo">Selecione o Estilo:</label>
                <select id="estilo" name="estilo" required>
                    <option value="" disabled selected>Escolha uma opção...</option>
                    <option value="anime">Anime / Mangá</option>
                    <option value="cartoon">Cartoon</option>
                    <option value="realista">Semi-Realista</option>
                    <option value="Chibi">Chibi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="detalhes">Briefing / Detalhes da Obra:</label>
                <textarea id="detalhes" name="detalhes" rows="5" required placeholder="Descreva como você quer a sua ilustração (personagens, pose, cores, fundo...)"></textarea>
            </div>

            <div class="form-group">
                <label for="prazo">Data Preferencial de Entrega (Sujeito a confirmação):</label>
                <input type="date" id="prazo" name="prazo" required>
            </div>

            <button type="submit" class="btn-submit">Confirmar Pedido e Agendamento</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
