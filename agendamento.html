<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html" class="active">Agendar</a></li>
                <li><a href="status-pedidos.html">Meus Pedidos</a></li>
                <li><a href="cadastro.html" id="cadastroLink">Cadastro</a></li>
                <li><a href="admin.html" class="admin-link">🔧 Admin</a></li>
            </ul>
            <button class="user-btn" id="userBtn">👤 Entrar</button>
        </nav>
    </header>

    <main class="form-container">
        <h2>Fazer Agendamento</h2>
        <p style="text-align:center; margin-bottom:2rem; color:#c7d2fe;" id="userInfo"></p>

        <form id="agendamentoForm">
            <label>Seu Usuário / Email</label>
            <input type="text" id="userField" readonly required>

            <label>Serviço Desejado</label>
            <select name="servico" required>
                <option value="">Selecione um serviço...</option>
                <option value="Chibi/Cartoon">Chibi / Cartoon - R$ 50</option>
                <option value="Anime Full Body">Anime / Mangá Full Body - R$ 120</option>
                <option value="Concept Art">Concept Art / Cenário - R$ 200</option>
                <option value="Ilustração Infantil">Ilustração Infantil - R$ 50</option>
                <option value="Capa de Livro / Thumbnail">Capa de Livro / Thumbnail - R$ 150</option>
            </select>

            <label>Descrição Detalhada da Arte</label>
            <textarea name="descricao" rows="6" placeholder="Descreva personagem, pose, cores, referências..." required></textarea>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div>
                    <label>Data de Entrega Desejada (mínimo 7 dias)</label>
                    <input type="date" id="dataEntrega" name="data_preferencial" required>
                </div>
                <div>
                    <label>Forma de Pagamento</label>
                    <select name="pagamento" required>
                        <option value="">Selecione...</option>
                        <option value="PIX">PIX (Recomendado)</option>
                        <option value="Cartão">Cartão de Crédito</option>
                        <option value="Transferência">Transferência Bancária</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-primary">Enviar Agendamento</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();

        if (!currentUser) {
            alert("Você precisa estar logado para fazer um agendamento.");
            window.location.href = "cadastro.html";
        } else {
            document.getElementById('userField').value = currentUser.username || currentUser.nome;
            document.getElementById('userInfo').innerHTML = `Logado como: <strong>${currentUser.nome}</strong>`;
        }

        // Data mínima = hoje + 7 dias
        const hoje = new Date();
        hoje.setDate(hoje.getDate() + 7);
        document.getElementById('dataEntrega').setAttribute('min', hoje.toISOString().split('T')[0]);

        // Sistema de login no botão
        const cadastroLink = document.getElementById('cadastroLink');
        const userBtn = document.getElementById('userBtn');
        if (currentUser) {
            cadastroLink.style.display = 'none';
            userBtn.innerHTML = `👤 ${currentUser.nome.split(" ")[0]} ▼`;
            userBtn.onclick = () => {
                if (confirm("Deseja sair da conta?")) logout();
            };
        }

        // Enviar agendamento para o banco
        document.getElementById('agendamentoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const servico = document.querySelector('[name="servico"]').value;
            const descricao = document.querySelector('[name="descricao"]').value;
            const data_preferencial = document.querySelector('[name="data_preferencial"]').value;
            const pagamento = document.querySelector('[name="pagamento"]').value;

            const valores = {
                "Chibi/Cartoon": 50,
                "Anime Full Body": 120,
                "Concept Art": 200,
                "Ilustração Infantil": 50,
                "Capa de Livro / Thumbnail": 150
            };

            try {
                const response = await fetch('/api/agendar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        servico,
                        descricao,
                        data_preferencial,
                        pagamento,
                        valor: valores[servico] || 100
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`✅ Agendamento #${result.id} enviado com sucesso!`);
                    window.location.href = 'status-pedidos.html';
                } else {
                    alert(result.message || "Erro ao enviar agendamento");
                }
            } catch (error) {
                alert("Erro de conexão com o servidor. Verifique se o server.js está rodando.");
            }
        });
    </script>
</body>
</html>
