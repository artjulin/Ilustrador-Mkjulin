<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Suporte - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chat-box {
            max-width: 800px;
            margin: 2rem auto;
            background: #1e2937;
            border-radius: 20px;
            overflow: hidden;
            height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 1.2rem;
            background: #6366f1;
            color: white;
            text-align: center;
            font-weight: 600;
        }
        .messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f172a;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
        }
        .message.client {
            background: #6366f1;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.admin {
            background: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            padding: 1rem;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 50px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="agendamento.html">Agendar</a></li>
                <li><a href="status-pedido.html">Meus Pedidos</a></li>
                <li><a href="chat-cliente.html" class="active">💬 Chat com Suporte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="chat-box">
            <div class="chat-header">
                Chat com Mkjulin (Suporte)
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" style="padding:0 30px; background:#6366f1; border:none; border-radius:50px;">Enviar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Chat com Suporte</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();
        if (!currentUser) {
            alert("Você precisa estar logado para usar o chat.");
            window.location.href = "cadastro.html";
        }

        let messages = JSON.parse(localStorage.getItem('chatMessages')) || [];

        function renderMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.from}`;
                div.innerHTML = msg.text;
                messagesDiv.appendChild(div);
            });

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text === '') return;

            // Mensagem do Cliente
            messages.push({ text: text, from: 'client', time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) });
            localStorage.setItem('chatMessages', JSON.stringify(messages));
            renderMessages();
            input.value = '';

            // Simulação de resposta do Admin (Mkjulin)
            setTimeout(() => {
                const respostas = [
                    "Olá! Entendi sua solicitação.",
                    "Vou analisar e te dou um retorno em breve.",
                    "Perfeito, já estou trabalhando nisso.",
                    "Alguma referência adicional?",
                    "Ótimo! Qualquer dúvida é só falar."
                ];
                const random = respostas[Math.floor(Math.random() * respostas.length)];
                
                messages.push({ 
                    text: random, 
                    from: 'admin', 
                    time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) 
                });
                localStorage.setItem('chatMessages', JSON.stringify(messages));
                renderMessages();
            }, 1200);
        }

        // Carregar mensagens ao abrir
        window.onload = renderMessages;
    </script>
</body>
</html>
