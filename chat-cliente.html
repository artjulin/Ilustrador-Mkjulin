<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Suporte - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="status-pedidos.html">Meus Pedidos</a></li>
                <li><a href="chat-cliente.html" class="active">💬 Chat</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="chat-box">
            <div class="chat-header">Chat com Mkjulin (Suporte)</div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();
        if (!currentUser) {
            alert("Você precisa estar logado.");
            window.location.href = "cadastro.html";
        }

        let messages = JSON.parse(localStorage.getItem('chatMessages')) || [];

        function renderMessages() {
            const div = document.getElementById('messages');
            div.innerHTML = '';
            messages.forEach(m => {
                const msg = document.createElement('div');
                msg.className = `message ${m.from}`;
                msg.textContent = m.text;
                div.appendChild(msg);
            });
            div.scrollTop = div.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            messages.push({ text, from: 'client' });
            localStorage.setItem('chatMessages', JSON.stringify(messages));
            renderMessages();
            input.value = '';

            // Resposta automática do Admin
            setTimeout(() => {
                const respostas = ["Entendi!", "Vou verificar agora.", "Perfeito!", "Aguarde um momento..."];
                messages.push({ text: respostas[Math.floor(Math.random()*respostas.length)], from: 'admin' });
                localStorage.setItem('chatMessages', JSON.stringify(messages));
                renderMessages();
            }, 1000);
        }

        window.onload = renderMessages;
    </script>
</body>
</html>
