<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IlustraPro - Serviços</title>
  <link rel="stylesheet" href="servicos.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">IlustraPro</div>
    <nav id="sidebar-nav"></nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1 class="hero">Serviços Disponíveis</h1>
      <button id="btnNovoServico" class="btn" onclick="abrirModalServico()" style="display: none;">
        <i class="fas fa-plus"></i> Novo Serviço
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="servicos-grid">
      <!-- Preenchido via JavaScript -->
    </div>
  </div>

  <!-- Modal Novo Serviço (Apenas Admin) -->
  <div id="modalServico" class="modal">
    <div class="modal-content">
      <h2 id="modalTitleServico">Novo Serviço</h2>
      
      <form id="formServico">
        <div class="input-group">
          <label>Nome do Serviço</label>
          <input type="text" id="nomeServico" required>
        </div>

        <div class="input-group">
          <label>Descrição</label>
          <textarea id="descricaoServico" rows="4" required></textarea>
        </div>

        <div class="input-group">
          <label>Preço (R$)</label>
          <input type="number" id="precoServico" step="0.01" required>
        </div>

        <div class="input-group">
          <label>Tempo Estimado</label>
          <input type="text" id="tempoServico" placeholder="Ex: 5-7 dias" required>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 25px;">
          <button type="button" onclick="fecharModalServico()" style="flex:1; padding:14px; background:#374151; border-radius:12px;">Cancelar</button>
          <button type="submit" class="btn" style="flex:1;">Salvar Serviço</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    let servicos = [];

    // Carregar usuário logado
    function carregarUsuario() {
      const userData = localStorage.getItem('user');
      if (!userData) {
        window.location.href = "login.html";
        return;
      }

      currentUser = JSON.parse(userData);
      configurarInterface();
      carregarServicosDoBanco();
    }

    function configurarInterface() {
      const nav = document.getElementById('sidebar-nav');
      const btnNovo = document.getElementById('btnNovoServico');

      if (currentUser.role === 'admin') {
        nav.innerHTML = `
          <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
          <a href="agenda.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Agenda</a>
          <a href="clientes.html" class="nav-link"><i class="fas fa-users"></i> Clientes</a>
          <a href="portfolio.html" class="nav-link"><i class="fas fa-images"></i> Portfólio</a>
          <a href="servicos.html" class="nav-link active"><i class="fas fa-palette"></i> Serviços</a>
        `;
        btnNovo.style.display = 'block';
      } else {
        nav.innerHTML = `
          <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
          <a href="agenda.html" class="nav-link"><i class="fas fa-calendar-alt"></i> Meus Agendamentos</a>
          <a href="servicos.html" class="nav-link active"><i class="fas fa-palette"></i> Serviços</a>
        `;
        btnNovo.style.display = 'none';
      }
    }

    // Buscar serviços do banco de dados
    async function carregarServicosDoBanco() {
      try {
        const res = await fetch('/api/servicos');
        servicos = await res.json();
        renderizarServicos(servicos);
      } catch (error) {
        console.error("Erro ao carregar serviços:", error);
        alert("Erro ao conectar com o servidor.");
      }
    }

    function renderizarServicos(lista) {
      const grid = document.getElementById('servicos-grid');
      grid.innerHTML = '';

      lista.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3 style="color:#e879f9; margin-bottom:12px;">${s.nome}</h3>
          <p style="color:#aaa; margin-bottom:20px; line-height:1.5;">${s.descricao}</p>
          
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <small style="color:#777;">Tempo estimado</small><br>
              <strong>${s.tempo}</strong>
            </div>
            <div style="text-align:right;">
              <small style="color:#777;">A partir de</small><br>
              <strong style="font-size:1.7rem; color:#c026d3;">R$ ${parseFloat(s.preco).toFixed(2)}</strong>
            </div>
          </div>

          <button onclick="solicitarServico(${s.id})" 
                  style="width:100%; margin-top:25px; padding:16px; background: linear-gradient(90deg, #a855f7, #c026d3); border:none; border-radius:12px; color:white; font-weight:600;">
            ${currentUser.role === 'admin' ? 'Editar' : 'Solicitar este Serviço'}
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function solicitarServico(id) {
      const servico = servicos.find(s => s.id === id);
      if (currentUser.role === 'admin') {
        alert(`Editar serviço "${servico.nome}" (em breve)`);
      } else {
        if (confirm(`Deseja solicitar "${servico.nome}" por R$ ${servico.preco}?`)) {
          alert("✅ Solicitação enviada! O ilustrador entrará em contato em breve.");
        }
      }
    }

    function abrirModalServico() {
      document.getElementById('modalTitleServico').textContent = "Novo Serviço";
      document.getElementById('formServico').reset();
      document.getElementById('modalServico').style.display = 'flex';
    }

    function fecharModalServico() {
      document.getElementById('modalServico').style.display = 'none';
    }

    // Salvar novo serviço
    document.getElementById('formServico').addEventListener('submit', async function(e) {
      e.preventDefault();

      const novoServico = {
        nome: document.getElementById('nomeServico').value,
        descricao: document.getElementById('descricaoServico').value,
        preco: parseFloat(document.getElementById('precoServico').value),
        tempo: document.getElementById('tempoServico').value
      };

      try {
        await fetch('/api/servicos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novoServico)
        });
        alert("Serviço cadastrado com sucesso!");
        fecharModalServico();
        carregarServicosDoBanco();
      } catch (err) {
        alert("Erro ao salvar serviço.");
      }
    });

    // Iniciar página
    window.onload = carregarUsuario;
  </script>
</body>
</html>
