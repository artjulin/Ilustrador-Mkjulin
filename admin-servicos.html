<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html">🔧 Admin</a></li>
                <li><a href="admin-servicos.html" class="admin-link active">🛠️ Serviços</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main>
        <h1>Gerenciar Serviços</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem;">
            <div style="background:#1e2937; padding:2.5rem; border-radius:16px;">
                <h3>Chibi / Cartoon</h3>
                <p><strong>R$ 50</strong> por arte</p>
                <button style="margin-top:1.5rem; padding:10px 20px; background:#22c55e; border:none; border-radius:8px;">Editar</button>
            </div>
            <div style="background:#1e2937; padding:2.5rem; border-radius:16px;">
                <h3>Anime / Mangá Full Body</h3>
                <p><strong>R$ 120</strong> por arte</p>
                <button style="margin-top:1.5rem; padding:10px 20px; background:#22c55e; border:none; border-radius:8px;">Editar</button>
            </div>
            <div style="background:#1e2937; padding:2.5rem; border-radius:16px;">
                <h3>Concept Art / Cenário</h3>
                <p><strong>R$ 200</strong> por arte</p>
                <button style="margin-top:1.5rem; padding:10px 20px; background:#22c55e; border:none; border-radius:8px;">Editar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Painel Administrativo</p>
    </footer>
