<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html">🔧 Admin</a></li>
                <li><a href="admin-chat.html" class="admin-link active">💬 Chat com Clientes</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main style="display: flex; gap: 2rem; padding: 2rem;">
        <!-- Lista de Conversas -->
        <div style="width: 320px; background: #1e2937; padding: 1.5rem; border-radius: 16px; height: fit-content;">
            <h3>Conversas Ativas</h3>
            <div style="margin-top: 1rem;">
                <div style="padding: 14px; background: #334155; border-radius: 10px; margin-bottom: 10px; cursor: pointer;">Mariana Silva <span style="color:#22d3ee">(2)</span></div>
                <div style="padding: 14px; background: #334155; border-radius: 10px; margin-bottom: 10px; cursor: pointer;">Carlos Eduardo <span style="color:#fbbf24">(1)</span></div>
            </div>
        </div>

        <!-- Janela de Chat -->
        <div style="flex: 1; background: #1e2937; border-radius: 16px; padding: 2rem;">
            <h3>Chat com Mariana Silva</h3>
            <div style="height: 420px; background: #0f172a; border-radius: 12px; padding: 1.5rem; margin: 1.5rem 0; overflow-y: auto;">
                <p><strong>Mariana:</strong> Oi! Já tem o rascunho do meu Chibi?</p>
                <p style="text-align: right; color: #a5b4fc;"><strong>Você:</strong> Sim, estou enviando agora.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" placeholder="Digite sua mensagem..." style="flex:1; padding:14px; border-radius:50px; background:#334155; border:none; color:white;">
                <button style="padding:0 30px; background:#6366f1; border:none; border-radius:50px;">Enviar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Painel Administrativo</p>
    </footer>
</body>
</html>
