<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Clientes - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chat-container {
            display: flex;
            height: calc(100vh - 100px);
            gap: 20px;
            padding: 20px;
        }
        .chat-list {
            width: 320px;
            background: #1e2937;
            border-radius: 16px;
            padding: 1rem;
            overflow-y: auto;
        }
        .chat-window {
            flex: 1;
            background: #1e2937;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid #334155;
            font-weight: 600;
        }
        .messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
        }
        .message.admin {
            background: #6366f1;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.client {
            background: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            padding: 1rem;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="admin.html"> Admin</a></li>
                <li><a href="admin-chat.html" class="admin-link active">💬 Chat</a></li>
            </ul>
            <button class="user-btn" onclick="window.location.href='admin.html'">Voltar</button>
        </nav>
    </header>

    <main class="chat-container">
        <!-- Lista de Clientes -->
        <div class="chat-list">
            <h3>Conversas Ativas</h3>
            <div onclick="openChat(0)" style="padding:12px; background:#334155; margin:8px 0; border-radius:10px; cursor:pointer;">
                Mariana Silva <span style="color:#22d3ee">(Nova)</span>
            </div>
            <div onclick="openChat(1)" style="padding:12px; background:#1e2937; margin:8px 0; border-radius:10px; cursor:pointer;">
                Carlos Eduardo
            </div>
        </div>

        <!-- Janela do Chat -->
        <div class="chat-window">
            <div class="chat-header" id="chatHeader">
                Chat com Mariana Silva
            </div>
            <div class="messages" id="messages">
                <!-- Mensagens aparecem aqui via JS -->
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" style="padding:0 28px; background:#6366f1; border:none; border-radius:50px;">Enviar</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IlustraArt - Chat Administrativo</p>
    </footer>

    <script>
        let currentChat = 0;

        const chats = [
            { name: "Mariana Silva", messages: [
                { text: "Oi! Já tem o rascunho do meu Chibi?", from: "client" },
                { text: "Sim, estou enviando agora mesmo.", from: "admin" }
            ]},
            { name: "Carlos Eduardo", messages: [
                { text: "Gostei muito do conceito!", from: "client" }
            ]}
        ];

        function openChat(index) {
            currentChat = index;
            document.getElementById('chatHeader').textContent = `Chat com ${chats[index].name}`;
            renderMessages();
        }

        function renderMessages() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            
            chats[currentChat].messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.from}`;
                div.textContent = msg.text;
                messagesDiv.appendChild(div);
            });
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text === '') return;
            
            chats[currentChat].messages.push({ text: text, from: "admin" });
            renderMessages();
            input.value = '';

            // Simulação de resposta do cliente após 1 segundo
            setTimeout(() => {
                const responses = ["Entendi!", "Ficou ótimo!", "Pode mandar a versão final?", "Perfeito!"];
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                chats[currentChat].messages.push({ text: randomResponse, from: "client" });
                renderMessages();
            }, 800);
        }

        // Carregar primeiro chat ao abrir
        window.onload = () => {
            openChat(0);
        };
    </script>
</body>
</html>
