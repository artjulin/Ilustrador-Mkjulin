<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro / Login - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-container {
            max-width: 480px !important;
            margin: 4rem auto;
            padding: 3rem 2.5rem !important;
            background: #1e2937;
            border-radius: 24px;
            border: 1px solid #6366f1;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .form-container label {
            display: block;
            margin: 1.4rem 0 0.5rem;
            color: #93c5fd;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .form-container input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 14px;
            border: 1.5px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-container input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
            background: #111827;
        }
        .form-container input::placeholder {
            color: #64748b;
        }
        .btn-primary {
            width: 100%;
            margin-top: 2rem !important;
            padding: 16px !important;
            border-radius: 50px !important;
            font-size: 1.1rem !important;
            background: linear-gradient(90deg, #6366f1, #818cf8) !important;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.4);
        }
        .actions { margin-top: 1.5rem; display: flex; gap: 12px; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container">
        <h2 id="formTitle" style="text-align:center; margin-bottom:2rem; color:#c4d0ff;">Entrar na Conta</h2>

        <div style="display:flex; background:#0f172a; border-radius:12px; padding:5px; margin-bottom:2rem;">
            <button onclick="showLogin()" id="btnLogin" style="flex:1; padding:12px; border:none; border-radius:10px; background:#6366f1; color:white; font-weight:600;">Entrar</button>
            <button onclick="showRegister()" id="btnRegister" style="flex:1; padding:12px; border:none; border-radius:10px; background:transparent; color:#c7d2fe;">Cadastrar</button>
        </div>

        <!-- Login -->
        <div id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="Sua senha" required>
            <button onclick="login()" class="btn-primary">Entrar</button>
        </div>

        <!-- Cadastro -->
        <div id="registerForm" style="display:none;">
            <label>Nome Completo</label>
            <input type="text" id="regNome" placeholder="Seu nome completo" required>
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="seu@email.com" required>
            <label>CPF</label>
            <input type="text" id="regCpf" placeholder="000.000.000-00" maxlength="14">
            <label>Senha</label>
            <input type="password" id="regPassword" placeholder="Crie uma senha" required>
            <button onclick="register()" class="btn-primary">Cadastrar-se</button>
        </div>

        <!-- Editar/Remover Conta (aparece após login) -->
        <div id="editarContaForm" style="display:none; margin-top:2rem; border-top: 1px solid #475569; padding-top:1.5rem;">
            <button onclick="editarPerfil()" class="btn-primary" style="margin-top:0;">Editar Meu Cadastro</button>
            <button onclick="excluirConta()" class="btn-primary" style="background:#ef4444; margin-top:1rem;">Excluir Minha Conta</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('editarContaForm').style.display = 'none';
            document.getElementById('btnLogin').style.background = '#6366f1';
            document.getElementById('btnRegister').style.background = 'transparent';
            document.getElementById('formTitle').textContent = 'Entrar na Conta';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('editarContaForm').style.display = 'none';
            document.getElementById('btnLogin').style.background = 'transparent';
            document.getElementById('btnRegister').style.background = '#6366f1';
            document.getElementById('formTitle').textContent = 'Criar Nova Conta';
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!email || !password) return alert("Preencha email e senha");

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password })
                });
                const data = await res.json();

                if (data.success) {
                    saveUser(data.user);
                    alert(`✅ Bem-vindo, ${data.user.nome}!`);
                    showEditForm();
                } else {
                    alert(data.message || "Email ou senha incorretos");
                }
            } catch (e) {
                alert("Erro ao conectar com o servidor");
            }
        }

        function showEditForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('editarContaForm').style.display = 'block';
        }

        async function editarPerfil() {
            const user = getCurrentUser();
            if (!user) return;

            const novoNome = prompt("Novo nome:", user.nome);
            const novoEmail = prompt("Novo email:", user.username);
            const novoCPF = prompt("Novo CPF:", user.cpf || '');

            if (!novoNome || !novoEmail) return;

            try {
                const res = await fetch(`/api/clientes/${user.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: novoNome, username: novoEmail, cpf: novoCPF })
                });
                const data = await res.json();

                if (data.success) {
                    alert("✅ Cadastro atualizado com sucesso!");
                    window.location.reload();
                } else {
                    alert("Erro ao atualizar cadastro");
                }
            } catch (e) {
                alert("Erro ao conectar com o servidor");
            }
        }

        async function excluirConta() {
            if (!confirm("Tem certeza que deseja excluir sua conta? Essa ação não pode ser desfeita.")) return;

            try {
                const res = await fetch(`/api/clientes/${getCurrentUser().id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("✅ Conta excluída com sucesso!");
                    localStorage.removeItem('currentUser');
                    window.location.href = 'cadastro.html';
                }
            } catch (e) {
                alert("Erro ao excluir conta");
            }
        }

        async function register() {
            // ... (mesma função anterior)
        }
    </script>
</body>
</html>
