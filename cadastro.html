<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro / Login - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="comprar.html">Preços</a></li>
                <li><a href="agendamento.html">Agendar</a></li>
                <li><a href="status-pedidos.html">Meus Pedidos</a></li>
            </ul>
            <button class="user-btn" id="userBtn">👤 Entrar</button>
        </nav>
    </header>

    <main class="form-container" style="max-width: 520px;">
        <h2 id="formTitle" style="text-align:center;">Entrar na Conta</h2>

        <div style="display:flex; background:#0f172a; border-radius:12px; padding:5px; margin-bottom:2rem;">
            <button onclick="showLogin()" id="btnLogin" style="flex:1; padding:12px; border:none; border-radius:10px; background:#6366f1; color:white;">Entrar</button>
            <button onclick="showRegister()" id="btnRegister" style="flex:1; padding:12px; border:none; border-radius:10px; background:transparent;">Cadastrar</button>
        </div>

        <div id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            <label>Senha</label>
            <input type="password" id="loginPassword" placeholder="Sua senha" required>
            <button onclick="login()" class="btn-primary" style="width:100%; margin-top:1.5rem;">Entrar</button>
        </div>

        <div id="registerForm" style="display:none;">
            <label>Nome Completo</label>
            <input type="text" id="regNome" placeholder="Seu nome" required>
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="seu@email.com" required>
            <label>CPF</label>
            <input type="text" id="regCpf" placeholder="000.000.000-00" maxlength="14" required>
            <label>Senha</label>
            <input type="password" id="regPassword" placeholder="Senha" required>
            <button onclick="register()" class="btn-primary" style="width:100%; margin-top:1.5rem;">Cadastrar</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ilustrador Mkjulin. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const currentUser = getCurrentUser();
        const cadastroLink = document.getElementById('cadastroLink');
        const userBtn = document.getElementById('userBtn');

        if (currentUser) {
            cadastroLink.style.display = 'none';
            userBtn.innerHTML = `👤 ${currentUser.nome.split(" ")[0]} ▼`;
            userBtn.onclick = () => {
                if (confirm("Deseja sair?")) logout();
            };
        } else {
            cadastroLink.style.display = 'list-item';
            userBtn.textContent = "👤 Entrar";
            userBtn.onclick = () => window.location.href = 'cadastro.html';
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    </script>
</body>
</html>
