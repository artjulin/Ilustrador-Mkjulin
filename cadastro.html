<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro / Login - IlustraArt</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">IlustraArt</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="agendamento.html">Agendar</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-container" style="max-width: 480px;">
        <h2 id="formTitle">Entrar na Conta</h2>

        <div id="loginForm">
            <label>Usuário / E-mail</label>
            <input type="text" id="username" placeholder="Seu usuário" required>

            <label>Senha</label>
            <input type="password" id="password" placeholder="Senha" required>

            <button onclick="login()" class="btn-primary" style="width:100%; margin-top:20px;">Entrar</button>
            <p style="text-align:center; margin-top:15px;">
                Não tem conta? <a href="#" onclick="toggleForm()">Cadastre-se</a>
            </p>
        </div>

        <div id="registerForm" style="display:none;">
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Seu nome completo" required>

            <label>Usuário</label>
            <input type="text" id="regUsername" placeholder="Escolha um usuário" required>

            <label>Senha</label>
            <input type="password" id="regPassword" placeholder="Crie uma senha" required>

            <button onclick="register()" class="btn-primary" style="width:100%; margin-top:20px;">Cadastrar</button>
            <p style="text-align:center; margin-top:15px;">
                Já tem conta? <a href="#" onclick="toggleForm()">Faça Login</a>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        function toggleForm() {
            document.getElementById('loginForm').style.display = 
                document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = 
                document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (data.success) {
                    saveUser(data.user);
                    alert(`✅ Bem-vindo, ${data.user.nome}!`);
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || "Usuário ou senha incorretos");
                }
            } catch (e) {
                alert("Erro ao conectar com o servidor");
            }
        }

        async function register() {
            const nome = document.getElementById('nome').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            if (!nome || !username || !password) return alert("Preencha todos os campos");

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nome, username, password})
                });
                const data = await res.json();

                if (data.success) {
                    alert("✅ Cadastro realizado! Agora faça login.");
                    toggleForm();
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("Erro ao cadastrar");
            }
        }
    </script>
</body>
</html>
