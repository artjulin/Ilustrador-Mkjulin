<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Cliente - Mkjulin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">Mkjulin</div>
            <ul class="nav-buttons">
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="agendamento.html">Agendamento</a></li>
                <li><a href="clientes.html">Área do Cliente</a></li>
                <li><a href="cadastro.html" class="active">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Criar sua Conta</h2>
            <p>Faça seu cadastro obrigatório para conseguir agendar e gerenciar suas ilustrações.</p>

            <form id="form-cadastro" onsubmit="salvarCadastro(event)">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required placeholder="Ex: João Silva">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required placeholder="joao@email.com">
                </div>

                <div class="form-group">
                    <label for="whatsapp">WhatsApp / Celular:</label>
                    <input type="tel" id="whatsapp" required placeholder="(11) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="senha">Crie uma Senha:</label>
                    <input type="password" id="senha" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; border-radius: 8px;">Cadastrar e Fazer Login</button>
            </form>

            <div class="auth-footer">
                Já tem um cadastro? <a href="#">Fazer Login</a>
            </div>
        </div>
    </main>

    <script>
        function salvarCadastro(event) {
            event.preventDefault();
            // Salva o estado de login no navegador do cliente (LocalStorage)
            localStorage.setItem('clienteLogado', 'true');
            localStorage.setItem('nomeCliente', document.getElementById('nome').value);
            
            alert('Cadastro realizado com sucesso! Agora você está liberado para agendar.');
            window.location.href = 'agendamento.html';
        }
    </script>
</body>
</html>
